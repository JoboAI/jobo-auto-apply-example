# Local development: `npm run db:up` starts only Postgres (port 5433 on
# loopback, so it never clashes with a Postgres already on 5432).
#
# The whole app in containers: `docker compose --profile app up --build`
# (reads .env.local; DATABASE_URL and DATA_DIR are set here).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auto_apply
      POSTGRES_PASSWORD: auto_apply
      POSTGRES_DB: auto_apply
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auto_apply -d auto_apply']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: [app]
    build: .
    command: ['npm', 'run', 'db:migrate']
    environment: &app-env
      DATABASE_URL: postgres://auto_apply:auto_apply@postgres:5432/auto_apply
      DATA_DIR: /data
    env_file:
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: [app]
    build: .
    environment: *app-env
    env_file:
      - path: .env.local
        required: false
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - resumes:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: [app]
    build: .
    command: ['npm', 'run', 'worker']
    stop_grace_period: 3m
    environment: *app-env
    env_file:
      - path: .env.local
        required: false
    volumes:
      - resumes:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  resumes:
